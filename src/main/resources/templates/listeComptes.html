<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion Bancaire</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icônes Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .account-card {
            transition: transform 0.3s;
        }
        .account-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary">
                <i class="fas fa-piggy-bank me-2"></i>Gestion des Comptes
            </h1>
            <a href="/ajouter" class="btn btn-success">
                <i class="fas fa-plus-circle me-1"></i> Nouveau Compte
            </a>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="compte : ${comptes}">
                <div class="card account-card h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0" th:text="${compte.titulaire}"></h5>
                    </div>
                    <div class="card-body">
                        <p class="card-text">
                            <strong>ID:</strong> <span th:text="${compte.id}"></span>
                        </p>
                        <p class="card-text">
                            <strong>Solde:</strong> 
                            <span th:text="${#numbers.formatDecimal(compte.solde, 1, 2)}">€</span>
                        </p>
                    </div>
                    <div class="card-footer bg-transparent">
                        <a th:href="@{'/compte/' + ${compte.id}}" class="btn btn-sm btn-primary me-2">
                            <i class="fas fa-eye"></i> Détails
                        </a>
                        <a th:href="@{'/supprimer/' + ${compte.id}}" class="btn btn-sm btn-danger">
                            <i class="fas fa-trash-alt"></i> Supprimer
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
