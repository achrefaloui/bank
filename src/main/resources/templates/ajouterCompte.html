<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter un compte</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icônes Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="form-container bg-white">
            <h1 class="text-center mb-4">
                <i class="fas fa-plus-circle text-primary"></i> Ajouter un compte
            </h1>
            
            <form th:action="@{/ajouter}" th:object="${compte}" method="post">
                <div class="mb-3">
                    <label for="titulaire" class="form-label">Titulaire du compte</label>
                    <input type="text" class="form-control" id="titulaire" 
                           th:field="*{titulaire}" required
                           placeholder="Nom du titulaire">
                </div>
                
                <div class="mb-4">
                    <label for="solde" class="form-label">Solde initial</label>
                    <div class="input-group">
                        <input type="number" step="0.01" class="form-control" id="solde"
                               th:field="*{solde}" required
                               placeholder="Montant initial">
                        <span class="input-group-text">€</span>
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-save me-2"></i> Enregistrer
                    </button>
                    <a href="/comptes" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
