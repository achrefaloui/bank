<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détails du Compte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .operation-box {
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .solde {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Détails du Compte</h2>
            </div>
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <p><strong>ID :</strong> <span th:text="${compte.id}"></span></p>
                        <p><strong>Titulaire :</strong> <span th:text="${compte.titulaire}"></span></p>
                        <p><strong>Solde :</strong> <span class="solde" th:text="${#numbers.formatDecimal(compte.solde, 1, 2) + ' €'}"></span></p>
                    </div>
                </div>

                <div class="operation-box">
                    <h4 class="mb-3">Dépôt</h4>
                    <form th:action="@{'/depot/' + ${compte.id}}" method="post" class="row g-3">
                        <div class="col-auto">
                            <input name="montant" type="number" step="0.01" min="0" 
                                   class="form-control" placeholder="Montant" required>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-plus-circle"></i> Déposer
                            </button>
                        </div>
                    </form>
                </div>

                <div class="operation-box">
                    <h4 class="mb-3">Retrait</h4>
                    <form th:action="@{'/retrait/' + ${compte.id}}" method="post" class="row g-3">
                        <div class="col-auto">
                            <input name="montant" type="number" step="0.01" min="0" 
                                   class="form-control" placeholder="Montant" required>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-minus-circle"></i> Retirer
                            </button>
                        </div>
                    </form>
                </div>

                <div class="mt-3">
                    <a href="/comptes" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Retour à la liste
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS et Font Awesome -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
